<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Whisk — one messy folder becomes four tidy actions">
  <title>Whisk</title>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211E33"/>
      <stop offset="1" stop-color="#151221"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A63F1"/>
      <stop offset="1" stop-color="#A04EE0"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <rect x="70" y="62" width="176" height="176" rx="40"/>
    </clipPath>
  </defs>

  <!-- Dark card: keeps contrast identical in GitHub's light and dark themes. -->
  <rect width="1000" height="300" rx="16" fill="url(#card)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#332E4C"/>

  <!-- The app badge: a whisk, whisking. -->
  <g clip-path="url(#badgeClip)">
    <rect x="70" y="62" width="176" height="176" fill="url(#badge)"/>
    <!-- crumbs being stirred out of the corner -->
    <g fill="#FFFFFF" opacity="0.5">
      <circle cx="112" cy="206" r="3">
        <animate attributeName="cy" values="206;196;206" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="206" cy="200" r="2.4">
        <animate attributeName="cy" values="200;192;200" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="176" cy="214" r="2">
        <animate attributeName="cy" values="214;204;214" dur="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- the whisk: handle, four wires, rocking around the grip -->
    <g stroke="#FFFFFF" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
        values="-6 158 96; 6 158 96; -6 158 96" dur="2.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      <path d="M158 90 L158 130" stroke-width="11"/>
      <path d="M158 130 C122 148 122 186 158 200" stroke-width="5"/>
      <path d="M158 130 C194 148 194 186 158 200" stroke-width="5"/>
      <path d="M158 130 C140 150 140 184 158 200" stroke-width="5"/>
      <path d="M158 130 C176 150 176 184 158 200" stroke-width="5"/>
      <path d="M158 130 L158 200" stroke-width="5"/>
    </g>
  </g>
  <rect x="70.5" y="62.5" width="175" height="175" rx="40" fill="none" stroke="#4B4470"/>

  <!-- Wordmark. -->
  <text x="392" y="150" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#F4F2FA" letter-spacing="-1.5">Whisk</text>
  <text x="396" y="188" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="21" fill="#948FB0">Keep your folders clean, automatically.</text>

  <!-- One grey pile resolving into the four actions. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6C6788">
    <rect x="396" y="214" width="404" height="8" rx="4" fill="#2A2640"/>
    <rect x="396" y="214" width="112" height="8" rx="4" fill="#8B79F2">
      <animate attributeName="width" values="0; 112; 112" keyTimes="0; 0.3; 1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="516" y="214" width="96" height="8" rx="4" fill="#3FA294" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.3; 0.45; 1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="620" y="214" width="84" height="8" rx="4" fill="#C85B41" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.45; 0.6; 1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="712" y="214" width="88" height="8" rx="4" fill="#E8A33D" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.6; 0.75; 1" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="396" y="248">move</text>
    <text x="516" y="248">rename</text>
    <text x="620" y="248">trash</text>
    <text x="712" y="248">run</text>
  </g>
</svg>
