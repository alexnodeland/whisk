<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Safety: dry-run previews actions without performing them, budgets auto-pause runaway rules, and files go to the Trash, never deleted">
  <title>Whisk safety</title>

  <defs>
    <linearGradient id="scard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211E33"/>
      <stop offset="1" stop-color="#151221"/>
    </linearGradient>
    <marker id="sarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#524B78"/>
    </marker>
  </defs>

  <rect width="1000" height="340" rx="16" fill="url(#scard)"/>
  <rect x="0.5" y="0.5" width="999" height="339" rx="16" fill="none" stroke="#332E4C"/>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">

    <!-- ============ 1. dry-run ============ -->
    <g>
      <rect x="40" y="48" width="288" height="244" rx="12" fill="#1C1930" stroke="#363052"/>
      <text x="184" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#8B79F2" letter-spacing="1.2">DRY-RUN</text>
      <!-- the planned move, marching ants: announced, not performed -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
        <rect x="70" y="104" width="104" height="30" rx="7" fill="#120F1E" stroke="#4B4470"/>
        <text x="122" y="123" text-anchor="middle" fill="#948FB0">report.pdf</text>
        <path d="M182 119 L226 119" stroke="#524B78" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#sarrow)"/>
        <rect x="234" y="104" width="64" height="30" rx="7" fill="none" stroke="#8B79F2" stroke-width="1.6" stroke-dasharray="5 4">
          <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <text x="266" y="123" text-anchor="middle" fill="#8B79F2">~/Docs</text>
        <rect x="70" y="152" width="228" height="26" rx="6" fill="#181528" stroke="#2E2947"/>
        <text x="82" y="169" font-size="11" fill="#615C80" xml:space="preserve"><tspan fill="#E8A33D">would</tspan> move report.pdf → ~/Docs</text>
      </g>
      <text x="184" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#EFECF8">previewed, not performed</text>
      <text x="184" y="252" text-anchor="middle" font-size="12.5" fill="#948FB0">every action, announced first</text>
    </g>

    <!-- ============ 2. budgets ============ -->
    <g>
      <rect x="356" y="48" width="288" height="244" rx="12" fill="#1C1930" stroke="#363052"/>
      <text x="500" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#8B79F2" letter-spacing="1.2">BUDGETS</text>
      <!-- a runaway rule spends its budget, then pauses itself -->
      <rect x="392" y="112" width="216" height="10" rx="5" fill="#120F1E" stroke="#2B2745"/>
      <rect x="392" y="112" width="0" height="10" rx="5" fill="#E8A33D">
        <animate attributeName="width" values="0;216;216;0" keyTimes="0;0.5;0.92;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#E8A33D;#E8A33D;#C85B41;#C85B41" keyTimes="0;0.4;0.5;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
        <text x="392" y="146" fill="#615C80">100 actions / rule / sweep</text>
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.58;0.92;1" dur="6s" repeatCount="indefinite"/>
          <rect x="392" y="160" width="216" height="30" rx="7" fill="#181528" stroke="#C85B41"/>
          <text x="404" y="179" fill="#C85B41">⏸ unpack-zips auto-paused</text>
        </g>
      </g>
      <text x="500" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#EFECF8">runaways pause themselves</text>
      <text x="500" y="252" text-anchor="middle" font-size="12.5" fill="#948FB0">cooldowns, ledgers, hard budgets</text>
    </g>

    <!-- ============ 3. trash ============ -->
    <g>
      <rect x="672" y="48" width="288" height="244" rx="12" fill="#1C1930" stroke="#363052"/>
      <text x="816" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#8B79F2" letter-spacing="1.2">UNDO-FRIENDLY</text>
      <!-- the file drops into the Trash, and the way back stays drawn -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
        <rect x="712" y="100" width="96" height="28" rx="7" fill="#120F1E" stroke="#4B4470">
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 96 52; 96 52; 0 0" keyTimes="0;0.15;0.4;0.85;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/>
        </rect>
        <text x="760" y="118" text-anchor="middle" fill="#948FB0">old.dmg<animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 96 52; 96 52; 0 0" keyTimes="0;0.15;0.4;0.85;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1"/></text>
      </g>
      <!-- the Trash, drawn simply -->
      <g transform="translate(836 148)" stroke="#C85B41" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M4 8 L8 44 Q8.5 48 12 48 L36 48 Q39.5 48 40 44 L44 8"/>
        <path d="M0 8 L48 8"/>
        <path d="M17 8 L17 4 Q17 1 20 1 L28 1 Q31 1 31 4 L31 8"/>
        <path d="M15 16 L17 40 M24 16 L24 40 M33 16 L31 40" opacity="0.6"/>
      </g>
      <!-- recoverable: the arrow back out -->
      <path d="M900 170 Q922 150 900 128" stroke="#3FA294" stroke-width="2" fill="none" marker-end="url(#sarrow)" opacity="0.85"/>
      <text x="816" y="230" text-anchor="middle" font-size="16" font-weight="600" fill="#EFECF8">Trash, never delete</text>
      <text x="816" y="252" text-anchor="middle" font-size="12.5" fill="#948FB0">every removal stays recoverable</text>
    </g>

    <!-- ============ footer note ============ -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="500" y="322" text-anchor="middle" fill="#615C80">shell commands run argv-only, in a sanitized environment, after a one-time approval</text>
    </g>
  </g>
</svg>
